name: build
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Is this a release build?
        type: boolean
        required: true
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      PUBLISH_SUFFIX: snapshots
      MAVEN_USER: ${{ secrets.MAVEN_USER }}
      MAVEN_PASS: ${{ secrets.MAVEN_PASS }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK (Java 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: gradlew Permission Grant
        run: chmod +x gradlew

      - name: Build w/ Gradle
        run: ./gradlew build


      - name: Publish to Maven [Releases]
        if: ${{ github.event.inputs.release }}
        run: >-
          ./gradlew publishAllPublicationsToDevOsReleasesRepository
          -PdevOsReleasesUsername="${{ secrets.MAVEN_USER }}"
          -PdevOsReleasesPassword="${{ secrets.MAVEN_PASS }}"

      - name: Capture Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/